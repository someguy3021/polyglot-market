openapi: 3.0.3
info:
  title: Polyglot Market API
  version: 1.0.0
  description: |
    Единый контракт маркетплейса — единственный источник правды для двух бекендов
    (Laravel, NestJS) и семи фронтендов. Любое расхождение реализации с этим файлом
    ловится conformance-тестами (`packages/conformance`).

    Конвенции:
    * Единый формат ошибок: `{ status, error, message, details? }`.
    * Пагинация списков: `{ data: [...], meta: { currentPage, lastPage, perPage, total } }`.
    * Даты — ISO 8601 UTC (`date-time`).
    * Аутентификация — JWT Bearer. Гостевая корзина — заголовок `X-Cart-Token`.
    * `POST /orders` требует заголовок `Idempotency-Key` (UUID): повтор с тем же ключом
      возвращает исходный заказ и не создаёт дубликат.
    * `GET /api/docs` на каждом бекенде отдаёт этот файл как Swagger UI (вне спецификации).
  contact:
    name: Polyglot Market contributors
    url: https://github.com/polyglot-market/polyglot-market
  license:
    name: MIT
servers:
  - url: http://localhost:8000
    description: Laravel backend
  - url: http://localhost:3000
    description: NestJS backend
tags:
  - name: auth
  - name: catalog
  - name: cart
  - name: orders
  - name: seller
  - name: moderation
  - name: admin
  - name: service
paths:
  /health:
    get:
      operationId: getHealth
      tags: [service]
      summary: Живость сервиса
      security: []
      responses:
        "200":
          description: Сервис работает
          content:
            application/json:
              schema:
                type: object
                required: [status, service, time]
                properties:
                  status:
                    type: string
                    enum: [ok]
                  service:
                    type: string
                  time:
                    type: string
                    format: date-time

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Регистрация покупателя
      description: Создаёт пользователя с ролью `buyer`. Продавцов/модераторов назначает админ.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Пользователь создан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthToken"
        "422":
          $ref: "#/components/responses/ValidationError"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Вход по email и паролю
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: JWT-токен и пользователь
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthToken"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Текущий пользователь
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Профиль текущего пользователя
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /products:
    get:
      operationId: listProducts
      tags: [catalog]
      summary: Каталог одобренных товаров
      security: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - name: category
          in: query
          description: Slug категории
          schema: { type: string }
        - name: seller
          in: query
          description: Slug магазина продавца
          schema: { type: string }
        - name: q
          in: query
          description: Полнотекстовый поиск по названию (pg_trgm)
          schema: { type: string, minLength: 2, maxLength: 100 }
        - name: price_min
          in: query
          schema: { type: number, minimum: 0 }
        - name: price_max
          in: query
          schema: { type: number, minimum: 0 }
        - name: sort
          in: query
          schema:
            type: string
            enum: [newest, oldest, price_asc, price_desc]
            default: newest
      responses:
        "200":
          description: Страница каталога
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Product"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
        "422":
          $ref: "#/components/responses/ValidationError"

  /products/{id}:
    get:
      operationId: getProduct
      tags: [catalog]
      summary: Карточка товара
      security: []
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "200":
          description: Товар с картинками, категорией и продавцом
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          $ref: "#/components/responses/NotFound"

  /categories:
    get:
      operationId: listCategories
      tags: [catalog]
      summary: Категории каталога
      security: []
      responses:
        "200":
          description: Плоский список категорий
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Category"

  /cart:
    get:
      operationId: getCart
      tags: [cart]
      summary: Текущая корзина
      description: |
        Для авторизованного — аккаунтная корзина. Для гостя — по заголовку `X-Cart-Token`
        (UUID из ответа `POST /cart/items` при первом добавлении, хранится на клиенте).
      security:
        - bearerAuth: []
        - cartToken: []
      responses:
        "200":
          description: Корзина с позициями и подытогом
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /cart/items:
    post:
      operationId: addCartItem
      tags: [cart]
      summary: Добавить товар в корзину
      description: Гостю в ответе заголовок `X-Cart-Token` — сохранить и слать далее.
      security:
        - bearerAuth: []
        - cartToken: []
      parameters:
        - $ref: "#/components/parameters/CartTokenHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CartItemInput"
      responses:
        "201":
          description: Корзина после добавления
          headers:
            X-Cart-Token:
              description: Токен гостевой корзины (только для гостей)
              schema: { type: string, format: uuid }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Товар не в продаже (не approved) или нет на складе
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ValidationError"

  /cart/items/{id}:
    patch:
      operationId: updateCartItem
      tags: [cart]
      summary: Изменить количество позиции
      security:
        - bearerAuth: []
        - cartToken: []
      parameters:
        - $ref: "#/components/parameters/CartTokenHeader"
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity: { type: integer, minimum: 1, maximum: 99 }
      responses:
        "200":
          description: Корзина после изменения
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      operationId: deleteCartItem
      tags: [cart]
      summary: Удалить позицию из корзины
      security:
        - bearerAuth: []
        - cartToken: []
      parameters:
        - $ref: "#/components/parameters/CartTokenHeader"
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Корзина после удаления
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "404":
          $ref: "#/components/responses/NotFound"

  /cart/merge:
    post:
      operationId: mergeCart
      tags: [cart]
      summary: Мердж гостевой корзины в аккаунтную
      description: |
        Вызывается после логина/регистрации с тем `X-Cart-Token`, под которым гость
        собирал корзину. Позиции сливаются по товару (количества суммируются до 99),
        гостевая корзина помечается merged.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, format: uuid }
      responses:
        "200":
          description: Аккаунтная корзина после мерджа
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

  /promo/validate:
    post:
      operationId: validatePromo
      tags: [orders]
      summary: Проверка промокода
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, subtotal]
              properties:
                code: { type: string }
                subtotal: { type: number, minimum: 0 }
      responses:
        "200":
          description: Промокод применим
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromoValidation"
        "422":
          description: Промокод не применим (истёк, исчерпан, малый subtotal)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /shipping-methods:
    get:
      operationId: listShippingMethods
      tags: [orders]
      summary: Способы доставки
      security: []
      responses:
        "200":
          description: Активные способы доставки
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ShippingMethod"

  /orders:
    post:
      operationId: createOrder
      tags: [orders]
      summary: Оформить заказ из корзины
      description: |
        Требует `Idempotency-Key` (UUID). Повтор того же ключа тем же пользователем
        возвращает исходный заказ (200, не 201). Корзина конвертируется, склад
        уменьшается транзакционно.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Заказ создан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "200":
          description: Повтор с тем же Idempotency-Key — исходный заказ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Корзина пуста
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ValidationError"
    get:
      operationId: listMyOrders
      tags: [orders]
      summary: Мои заказы
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Заказы текущего пользователя
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /orders/{id}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Заказ по id
      description: Доступно владельцу, модератору и админу.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: Заказ с позициями
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /seller/products:
    get:
      operationId: listSellerProducts
      tags: [seller]
      summary: Товары продавца (все статусы)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Свои товары
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createSellerProduct
      tags: [seller]
      summary: Создать товар (черновик)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Черновик создан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /seller/products/{id}:
    put:
      operationId: updateSellerProduct
      tags: [seller]
      summary: Изменить свой товар
      description: Одобренный товар при правке возвращается в draft и требует повторной модерации.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ProductId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "200":
          description: Товар обновлён
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /seller/products/{id}/submit:
    post:
      operationId: submitSellerProduct
      tags: [seller]
      summary: Отправить товар на модерацию
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "200":
          description: Статус `pending_moderation`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Товар не в статусе draft/rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"

  /seller/products/{id}/images:
    post:
      operationId: uploadProductImage
      tags: [seller]
      summary: Загрузить изображение товара
      description: multipart/form-data, поле `file`; jpeg/png/webp до 5 МБ. Первое изображение становится primary.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ProductId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Изображение загружено (в S3-хранилище, с превью)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductImage"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /seller/products/{id}/images/{imageId}:
    delete:
      operationId: deleteProductImage
      tags: [seller]
      summary: Удалить изображение товара
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ProductId"
        - name: imageId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Удалено
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /seller/order-items:
    get:
      operationId: listSellerOrderItems
      tags: [seller]
      summary: Продажи продавца (позиции чужих заказов по своим товарам)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Позиции заказов по своим товарам
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/SellerOrderItem"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /moderator/queue:
    get:
      operationId: moderationQueue
      tags: [moderation]
      summary: Очередь модерации товаров
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Товары в статусе `pending_moderation`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /moderator/products/{id}/approve:
    post:
      operationId: approveProduct
      tags: [moderation]
      summary: Одобрить товар
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "200":
          description: Статус `approved`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Товар не в статусе `pending_moderation`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /moderator/products/{id}/reject:
    post:
      operationId: rejectProduct
      tags: [moderation]
      summary: Отклонить товар
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ProductId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 4, maxLength: 500 }
      responses:
        "200":
          description: Статус `rejected`, причина сохранена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Товар не в статусе `pending_moderation`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ValidationError"

  /admin/orders:
    get:
      operationId: listAllOrders
      tags: [admin]
      summary: Все заказы (админ)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/OrderStatus"
      responses:
        "200":
          description: Заказы всех пользователей
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/orders/{id}/status:
    put:
      operationId: updateOrderStatus
      tags: [admin]
      summary: Сменить статус заказа
      description: "Допустимые переходы: new→paid|cancelled, paid→shipped|cancelled, shipped→done, done/cancelled — терминальные."
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/OrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  $ref: "#/components/schemas/OrderStatus"
      responses:
        "200":
          description: Заказ обновлён
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Недопустимый переход статуса
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ValidationError"

  /admin/users:
    get:
      operationId: listUsers
      tags: [admin]
      summary: Пользователи (админ)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - name: role
          in: query
          schema:
            $ref: "#/components/schemas/UserRole"
      responses:
        "200":
          description: Список пользователей
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/User"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/users/{id}/role:
    put:
      operationId: updateUserRole
      tags: [admin]
      summary: Назначить роль пользователю
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  $ref: "#/components/schemas/UserRole"
      responses:
        "200":
          description: Роль обновлена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /admin/promo-codes:
    get:
      operationId: listPromoCodes
      tags: [admin]
      summary: Промокоды (админ)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Все промокоды
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PromoCode"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createPromoCode
      tags: [admin]
      summary: Создать промокод
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromoCodeInput"
      responses:
        "201":
          description: Промокод создан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromoCode"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /admin/products/{id}:
    delete:
      operationId: deleteProduct
      tags: [admin]
      summary: Удалить товар (жёстко)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "204":
          description: Удалено
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Товар входит в существующие заказы
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cartToken:
      type: apiKey
      in: header
      name: X-Cart-Token
  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PerPage:
      name: perPage
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    ProductId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    OrderId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    CartTokenHeader:
      name: X-Cart-Token
      in: header
      required: false
      description: Токен гостевой корзины (игнорируется при Bearer-авторизации)
      schema: { type: string, format: uuid }
  responses:
    ValidationError:
      description: Ошибка валидации входных данных
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - type: object
                required: [error]
                properties:
                  error:
                    type: string
                    enum: [validation_error]
    Unauthorized:
      description: Не аутентифицирован
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Недостаточно прав
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Не найдено
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    UserRole:
      type: string
      enum: [buyer, seller, moderator, admin]
    OrderStatus:
      type: string
      enum: [new, paid, shipped, done, cancelled]
    Error:
      type: object
      required: [status, error, message]
      properties:
        status:
          type: integer
          description: HTTP-код, дублируется в теле
          example: 404
        error:
          type: string
          enum: [validation_error, unauthorized, forbidden, not_found, conflict, unprocessable, internal]
        message:
          type: string
        details:
          type: object
          description: "Полевые ошибки валидации: { field: [messages] }"
          additionalProperties:
            type: array
            items: { type: string }
    PaginationMeta:
      type: object
      required: [currentPage, lastPage, perPage, total]
      properties:
        currentPage: { type: integer, minimum: 1 }
        lastPage: { type: integer, minimum: 1 }
        perPage: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }
    User:
      type: object
      required: [id, email, name, role, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        role:
          $ref: "#/components/schemas/UserRole"
        blocked: { type: boolean, default: false }
        shopName:
          type: string
          description: Название магазина (только для продавцов)
          nullable: true
        createdAt: { type: string, format: date-time }
    AuthToken:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
          description: JWT Bearer
        user:
          $ref: "#/components/schemas/User"
    RegisterInput:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        email: { type: string, format: email, maxLength: 255 }
        password: { type: string, minLength: 8, maxLength: 72 }
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    SellerBrief:
      type: object
      required: [id, shopName]
      properties:
        id: { type: string, format: uuid }
        shopName: { type: string }
    Category:
      type: object
      required: [id, slug, name]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        parentId:
          type: string
          format: uuid
          nullable: true
    ProductImage:
      type: object
      required: [id, url, isPrimary]
      properties:
        id: { type: string, format: uuid }
        url:
          type: string
          format: uri
          description: Полный URL основного изображения
        thumbUrl:
          type: string
          format: uri
          nullable: true
        isPrimary: { type: boolean }
    Product:
      type: object
      required: [id, title, slug, price, stock, status, category, seller, createdAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        slug: { type: string }
        description: { type: string }
        price: { type: number, minimum: 0 }
        stock: { type: integer, minimum: 0 }
        status:
          type: string
          enum: [draft, pending_moderation, approved, rejected]
        rejectionReason:
          type: string
          nullable: true
        categoryId: { type: string, format: uuid }
        category:
          $ref: "#/components/schemas/Category"
        seller:
          $ref: "#/components/schemas/SellerBrief"
        images:
          type: array
          items:
            $ref: "#/components/schemas/ProductImage"
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ProductList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
    ProductInput:
      type: object
      required: [title, description, price, categoryId]
      properties:
        title: { type: string, minLength: 2, maxLength: 200 }
        description: { type: string, maxLength: 5000 }
        price: { type: number, minimum: 0, exclusiveMinimum: true }
        stock: { type: integer, minimum: 0, default: 0 }
        categoryId: { type: string, format: uuid }
    CartItem:
      type: object
      required: [id, quantity, product]
      properties:
        id: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1 }
        product:
          $ref: "#/components/schemas/Product"
        lineTotal:
          type: number
          description: price × quantity
    Cart:
      type: object
      required: [id, items, subtotal]
      properties:
        id: { type: string, format: uuid }
        items:
          type: array
          items:
            $ref: "#/components/schemas/CartItem"
        subtotal: { type: number }
    CartItemInput:
      type: object
      required: [productId, quantity]
      properties:
        productId: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1, maximum: 99 }
    ShippingMethod:
      type: object
      required: [code, name, price, etaDays]
      properties:
        code: { type: string }
        name: { type: string }
        price: { type: number, minimum: 0 }
        etaDays: { type: integer, minimum: 0 }
    PromoValidation:
      type: object
      required: [code, valid, discount]
      properties:
        code: { type: string }
        valid: { type: boolean }
        discount: { type: number }
        reason:
          type: string
          nullable: true
    PromoCode:
      type: object
      required: [id, code, type, value, minSubtotal, active]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        type:
          type: string
          enum: [percent, fixed]
        value: { type: number }
        minSubtotal: { type: number }
        maxUses:
          type: integer
          nullable: true
        usedCount: { type: integer }
        expiresAt:
          type: string
          format: date-time
          nullable: true
        active: { type: boolean }
    PromoCodeInput:
      type: object
      required: [code, type, value]
      properties:
        code: { type: string, pattern: "^[A-Z0-9_-]{3,40}$" }
        type:
          type: string
          enum: [percent, fixed]
        value: { type: number, minimum: 0, exclusiveMinimum: true }
        minSubtotal: { type: number, minimum: 0, default: 0 }
        maxUses:
          type: integer
          minimum: 1
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
    OrderItem:
      type: object
      required: [id, title, price, quantity]
      properties:
        id: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        title:
          type: string
          description: Снапшот названия на момент заказа
        price:
          type: number
          description: Снапшот цены на момент заказа
        quantity: { type: integer, minimum: 1 }
    Order:
      type: object
      required: [id, status, subtotal, discount, shippingPrice, total, items, shippingMethod, shippingAddress, createdAt]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        status:
          $ref: "#/components/schemas/OrderStatus"
        subtotal: { type: number }
        discount: { type: number }
        shippingPrice: { type: number }
        total: { type: number }
        promoCode:
          type: string
          nullable: true
        shippingMethod:
          $ref: "#/components/schemas/ShippingMethod"
        shippingAddress:
          $ref: "#/components/schemas/ShippingAddress"
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    OrderList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Order"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
    OrderInput:
      type: object
      required: [shippingMethodCode, shippingAddress]
      properties:
        shippingMethodCode: { type: string }
        promoCode:
          type: string
          description: Применяется при оформлении; ошибка 422, если не применим
        shippingAddress:
          $ref: "#/components/schemas/ShippingAddress"
    ShippingAddress:
      type: object
      required: [line1, city, zip, country]
      properties:
        line1: { type: string, maxLength: 200 }
        line2:
          type: string
          maxLength: 200
        city: { type: string, maxLength: 100 }
        zip: { type: string, maxLength: 20 }
        country: { type: string, minLength: 2, maxLength: 2 }
    SellerOrderItem:
      type: object
      required: [id, orderId, orderStatus, title, price, quantity, createdAt]
      properties:
        id: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        orderStatus:
          $ref: "#/components/schemas/OrderStatus"
        productTitle: { type: string }
        title: { type: string }
        price: { type: number }
        quantity: { type: integer }
        createdAt: { type: string, format: date-time }
