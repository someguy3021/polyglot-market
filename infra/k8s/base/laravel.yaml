# Laravel-бекенд стенда (фича 03): тот же образ, что в docker-комбо (backend/laravel/Dockerfile).
# Второй носитель контракта за ingress (ADR-006 вживую): /api/laravel/* → laravel:8000.
# Та же БД, что у NestJS (общая PostgreSQL, ADR-001/002) — данные и сиды общие.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: laravel
  namespace: polyglot
  labels:
    app: laravel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: laravel
  template:
    metadata:
      labels:
        app: laravel
    spec:
      containers:
        - name: laravel
          image: localhost:5001/infra-laravel:k8s
          imagePullPolicy: Always # реестр локальный — проверка тега дёшево, зато up всегда подхватывает пересборку (ADR-012)
          env:
            - name: LOG_CHANNEL # логи в stderr → их собирает promtail (6.3)
              value: stderr
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_CONNECTION
              value: pgsql
            - name: DB_DATABASE
              value: polyglot
            - name: DB_USERNAME
              value: polyglot
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: polyglot-secrets
                  key: db-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: polyglot-secrets
                  key: jwt-secret
            - name: S3_ENDPOINT
              value: http://s3:9000 # pod → service DNS (как у nestjs)
            - name: S3_URL_BASE # браузер → проброшенный порт (ProductImage::publicUrl)
              value: http://127.0.0.1:59002/products
            - name: S3_BUCKET
              value: products
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: polyglot-secrets
                  key: s3-access-key
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: polyglot-secrets
                  key: s3-secret-key
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 384Mi
          readinessProbe: # /health — эндпоинт контракта, без авторизации
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 8
            periodSeconds: 5
            failureThreshold: 24 # первый бут artisan serve небыстрый
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: laravel
  namespace: polyglot
  labels:
    app: laravel
spec:
  selector:
    app: laravel
  ports:
    - name: http
      port: 8000
      targetPort: http
