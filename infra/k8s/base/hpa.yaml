# HPA стенда (6.2): оба бекенда масштабируются по CPU, метрики — metrics-server
# (infra/k8s/third-party/metrics-server.yaml). requests.cpu=100m у деплойментов
# обязателен — от него считаются проценты.
# Ожидание реальности: laravel — однопоточный artisan serve, ему горизонтальное
# масштабирование даёт параллелизм именно репликами.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nestjs
  namespace: polyglot
  labels:
    app: nestjs
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nestjs
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60 # демо-стенд: быстро отдаём реплики после нагрузки
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: laravel
  namespace: polyglot
  labels:
    app: laravel
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: laravel
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60
