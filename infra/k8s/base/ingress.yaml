# Маршрутизация стенда (фича 18): /api/* → NestJS со срезом префикса
# (Middleware strip-api, контракт не знает про /api), остальное → SPA.
# Конфликт SPA-маршрутов с префиксами контракта (/cart, /orders, /admin/*)
# исключён именно префиксом /api — поэтому один ingress, один origin.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: polyglot
  namespace: polyglot
  labels:
    app.kubernetes.io/part-of: polyglot-market
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: polyglot-strip-api@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: nestjs
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: react
                port:
                  number: 80
